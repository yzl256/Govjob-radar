    path: 4
    tier: B
    region: national
    entry: https://chrm.mohrss.gov.cn/
    extractor: structured
    schedule: {daily: 2}
    season: {peak_month: null, note: "常年滚动"}
    list_selector: null
    status: pending_survey
    notes: >-
      人社部官方聚合平台，转载各省事业单位/三支一扶/人才引进公告，
      是 C 类散落源的最佳兜底与交叉验证源（已核实其转载广东/山东公告）。
      去重规则：与省原发源撞车时保留原发链接，本源仅补缺。
