    path: 6
    tier: B
    region: national
    entry: https://www.iguopin.com/
    extractor: structured
    schedule: {daily: 2}
    season: {peak_month: 9, note: "秋招9-11月、春招3-4月为主"}
    list_selector: null
    status: pending_survey
    notes: 国资委背景聚合平台，字段较规范；央企官网校招栏作为补充源后续按需追加

  - id: cn-xibu
    name: 大学生志愿服务西部计划官网
    path: 9
    tier: B
    region: national
    entry: https://xibu.youth.cn/
    extractor: structured
    schedule: {daily: 1}
    season: {peak_month: 4, note: "招募季约3-5月，2026年计划招募5万名"}
    list_selector: null
    status: pending_survey
    notes: 已核实域名（官网 gzdt 栏目承载报名指南等）；报名走团系统

  - id: cn-tegang
    name: 教育部·特岗计划实施通知（政策源）
    path: 9
    tier: B
    region: national
    entry: http://www.moe.gov.cn/srcsite/A10/s6991/   # 教育部教师工作司目录
    extractor: structured
    schedule: {daily: 1}
    season: {peak_month: 5, note: "政策通知约每年5月；具体招聘由实施省份教育厅发布"}
    list_selector: null
    status: pending_survey
    notes: >-
      ⚠️ 特岗计划面向中西部实施省份；广东/山东/浙江三省均非特岗实施省，
      订阅该三省的用户基本用不到此路径，本源仅作政策日历。若未来订阅
      中西部省份，需在对应省 yaml 中追加该省教育厅招聘入口。

