meta:
  scope: national
  updated: 2026-08-20

sources:
  - id: cn-guokao
    name: 国家公务员局·中央机关考录专题
    path: 2
    tier: A
    region: national
    entry: https://bm.scs.gov.cn/            # 考录专题（公告+职位表+报名）
    org_entry: http://www.scs.gov.cn/        # 国家公务员局官网
    extractor: excel
    schedule: {daily: 3, peak: hourly}
    season: {peak_month: 10, note: "职位表 Excel 与公告同期发布，含学历/专业代码/政治面貌/应届等全字段"}
    list_selector: null
    status: pending_survey
    notes: A 类解析器的首要适配对象；10 月公告季加密到每小时

  - id: cn-jdwz
    name: 军队人才网·全军统一招考文职人员
    path: 7
    tier: A
    region: national
    entry: https://www.81rc.81.cn/           # 域名以当年招考公告为准
    extractor: excel
    schedule: {daily: 2, peak: hourly}
    season: {peak_month: 1, note: "统一招考约每年1月笔试，公告在前一年10~12月；另有各单位直接引才公告常年滚动"}
    list_selector: null
    status: pending_survey
    notes: 发布统一职位表；双一流理学/工学/医学硕士免笔试规则在岗位来源类别字段中体现

  - id: cn-guopin
